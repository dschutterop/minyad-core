version: 2
updates:
  # Every service pins exact versions in its own requirements.txt (see AGENTS.md);
  # without this, those pins never move and vulnerabilities go unnoticed.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/api"
      - "/control"
      - "/deadman"
      - "/forecast"
      - "/frontend"
      - "/host-services"
      - "/ingestion"
      - "/migrate"
      - "/minyad-strategy"
      - "/mobile-frontend"
      - "/monitoring"
      - "/reporting"
    schedule:
      interval: "weekly"
    groups:
      python-patch-and-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/api"
      - "/control"
      - "/deadman"
      - "/forecast"
      - "/frontend"
      - "/ingestion"
      - "/migrate"
      - "/minyad-strategy"
      - "/mobile-frontend"
      - "/monitoring"
      - "/reporting"
    schedule:
      interval: "weekly"
    groups:
      docker-base-images:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
